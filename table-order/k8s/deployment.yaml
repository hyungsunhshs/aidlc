apiVersion: apps/v1
kind: Deployment
metadata:
  name: table-order-api
  namespace: table-order
  labels:
    app: table-order-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: table-order-api
  template:
    metadata:
      labels:
        app: table-order-api
    spec:
      containers:
        - name: table-order-api
          image: your-ecr-registry/table-order-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: table-order-api-config
            - secretRef:
                name: table-order-api-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Namespace
metadata:
  name: table-order
