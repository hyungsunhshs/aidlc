apiVersion: v1
kind: Secret
metadata:
  name: table-order-api-secret
  namespace: table-order
type: Opaque
stringData:
  # 아래 값들은 실제 배포 시 교체해야 합니다
  DB_URL: "jdbc:postgresql://your-rds-endpoint:5432/tableorder"
  DB_USERNAME: "tableorder"
  DB_PASSWORD: "your-secure-password"
  JWT_SECRET: "your-256-bit-secret-key-for-jwt-token-generation-must-be-at-least-32-characters"
