# Production Profile Configuration
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# Logging - Production level
logging:
  level:
    com.tableorder: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
  file:
    name: /var/log/table-order/application.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30

# SpringDoc - Disable in production
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# CORS Configuration for production
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# Actuator - Restrict in production
management:
  endpoints:
    web:
      exposure:
        include: health,info
